version: 2

models:
  - name: mart_churn_customer_priority
    description: Clientes priorizados para ações de retenção.

    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique

      - name: churn_probability
        data_tests:
          - not_null

      - name: risk_band
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Low
                  - Medium
                  - High

      - name: priority_order
        data_tests:
          - not_null

      - name: priority_label
        data_tests:
          - not_null

      - name: recommended_action
        data_tests:
          - not_null